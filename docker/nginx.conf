map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 32m;
  gzip on;
  gzip_types application/javascript application/json text/css text/xml image/svg+xml;

  location ~ ^/(config\.xml|xml/|code_md5\.dat|res_md5\.dat|debug/|cdn/|messagebroker|loginselectlist|login2?$|updateplayernovice|visualizeregister|nicknamecheck|flashversionservlet) {
    proxy_pass http://server:8787;
    proxy_set_header Host $host;
  }

  location /socket {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location = / {
    root /srv/dist;
    try_files /index.html =404;
  }

  location / {
    root /srv/dist;
    try_files $uri @public;
  }

  location @public {
    root /srv/public;
    try_files $uri =404;
    expires 7d;
  }
}
